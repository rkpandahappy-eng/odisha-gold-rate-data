name: Update rates

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). GitHub often starts scheduled runs hours late,
    # and the source changes its rate at different times of day (seen 10:30 AM and 2:25 PM IST),
    # so check every 30 minutes from 9:47 AM to 9:17 PM IST, plus a few night checks.
    # Odd minutes avoid GitHub's busy top-of-the-hour queue. A commit is made only when rates change.
    - cron: "17,47 4-15 * * *"
    - cron: "17 0,18,21 * * *"
  # The admin panel saves manual rates here; publish them right away.
  push:
    branches: [main]
    paths: ["manual/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m unittest discover -s scraper/tests -v
          node --test tests/admin_api.test.mjs tests/timer.test.mjs

      - name: Build rates
        id: build
        env:
          SRC1_URL: ${{ secrets.SRC1_URL }}
          SRC2_URL: ${{ secrets.SRC2_URL }}
        run: |
          set +e
          python scraper/build_rates.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update rates $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            # The admin panel may have saved something meanwhile (other files).
            for attempt in 1 2 3; do
              git pull --rebase --quiet && git push && break
              sleep 5
            done
          fi

      - name: Fail if nothing was published
        if: steps.build.outputs.code != '0'
        run: |
          echo "build_rates.py exited with ${{ steps.build.outputs.code }}: the scraper failed and there was no manual entry for every city. Old rates were kept. Check the log above."
          exit 1
